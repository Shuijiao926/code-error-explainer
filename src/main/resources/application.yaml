server:
  port: 8080

spring:
  application:
    name: code-error-explainer
  datasource:
    url: jdbc:mysql://localhost:3306/code_error_explainer?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

ai:
  provider: ${AI_PROVIDER:deepseek}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-chat}
  base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
  timeout: 30s
