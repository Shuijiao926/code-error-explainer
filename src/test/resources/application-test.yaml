# 测试专用配置：H2 内存库 + Mock AI，无需本地 MySQL 即可验证全链路
spring:
  datasource:
    url: jdbc:h2:mem:explainer;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto

ai:
  provider: mock
  api-key: ""
